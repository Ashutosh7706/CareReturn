[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "care-return-analytics"
version = "1.0.0"
description = "An independently implemented, patient-aware hospital readmission analytics study"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "matplotlib>=3.7", "joblib>=1.3", "ucimlrepo>=0.0.7", "streamlit>=1.35", "plotly>=5.20"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
